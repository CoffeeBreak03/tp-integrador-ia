name: Coverage Report

on:
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install && cd frontend && npm install && cd ../functions && npm install && cd ..

      - name: Run frontend coverage
        run: cd frontend && npm run test:coverage

      - name: Run backend coverage
        run: cd functions && npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json,./functions/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true
