name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm install

      - name: Install dependencies (Frontend)
        run: cd frontend && npm install

      - name: Install dependencies (Functions)
        run: cd functions && npm install

      - name: Run frontend tests
        run: cd frontend && npm run test

      - name: Run backend tests
        run: cd functions && npm run test

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build functions
        run: cd functions && npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install && cd frontend && npm install && cd ../functions && npm install && cd ..

      - name: Lint frontend
        run: cd frontend && npm run lint 2>/dev/null || echo "Linter not configured"

      - name: Lint backend
        run: cd functions && npm run lint 2>/dev/null || echo "Linter not configured"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
