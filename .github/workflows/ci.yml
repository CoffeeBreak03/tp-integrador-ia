name: CI/CD Pipeline

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main, deploy]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (Root)
        run: npm install

      - name: Install dependencies (Frontend)
        run: cd frontend && npm install

      - name: Install dependencies (Functions)
        run: cd functions && npm install

      - name: Run frontend tests
        run: cd frontend && npm run test

      - name: Run backend tests
        run: cd functions && npm run test

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build functions
        run: cd functions && npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install && cd frontend && npm install && cd ../functions && npm install && cd ..

      - name: Lint frontend
        run: cd frontend && npm run lint 2>/dev/null || echo "Linter not configured"

      - name: Lint backend
        run: cd functions && npm run lint 2>/dev/null || echo "Linter not configured"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_225CE5157DF24BEA9A74E2012075B343 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7B345BC6EFD1423A9F6B0F06DE73EA32 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5EDE20F9CB0C477FBFA2F19EB404B2E3 }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies (Root, Frontend, Functions)
        run: |
          npm install
          cd frontend && npm install
          cd ../functions && npm install

      - name: Build Frontend and Backend
        run: |
          cd frontend && npm run build
          cd ../functions && npm run build

      - name: Prune devDependencies in Backend (Optimization)
        run: |
          cd functions && npm prune --production

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'manga-translate'
          slot-name: 'Production'
          package: .

